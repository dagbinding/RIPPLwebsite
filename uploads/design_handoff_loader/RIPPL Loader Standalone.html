  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>RIPPL · Interactive Mark<\u002Ftitle>\n  <style>\n    :root {\n      --cream: #F2EBDC;\n    }\n\n    *, *::before, *::after {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n    }\n\n    html, body {\n      width: 100%;\n      min-height: 100vh;\n      background: var(--cream);\n    }\n\n    body {\n      display: flex;\n      align-items: center;\n      justify-content: center;\n    }\n\n    .mark-wrap {\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      gap: 32px;\n      user-select: none;\n    }\n\n    .mark {\n      width: 300px;\n      height: 300px;\n      display: block;\n      overflow: visible;\n    }\n\n    .loop {\n      cursor: pointer;\n    }\n\n    .hint {\n      font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;\n      font-size: 11px;\n      letter-spacing: 0.12em;\n      text-transform: uppercase;\n      color: #2E1E10;\n      opacity: 0.32;\n    }\n  <\u002Fstyle>\n\n\n<\u002Fhead>\n<body>\n\n<div class=\"mark-wrap\">\n  <svg class=\"mark\" viewBox=\"-150 -150 300 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"RIPPL interactive mark\">\n\n    <!--\n      Two instances of the same PNG loop, each rotated to match\n      the RIPPL logo composition:\n        Left  → apex pointing SW (210° CW from top), centre lower-left\n        Right → apex pointing NE (30°  CW from top), centre upper-right\n    -->\n\n    <!-- ░░ Left loop — rendered behind right loop ░░ -->\n    <g class=\"loop\" id=\"loop-left\">\n      <!-- Transparent hit circle so the whole loop area is hoverable -->\n      <circle r=\"78\" fill=\"transparent\" stroke=\"none\"><\u002Fcircle>\n      <image id=\"img-left\" href=\"38e06632-94ba-45c8-aa31-36cc73e9c01a\" x=\"-80\" y=\"-80\" width=\"160\" height=\"160\" preserveAspectRatio=\"xMidYMid meet\"><\u002Fimage>\n    <\u002Fg>\n\n    <!-- ░░ Right loop — rendered in front ░░ -->\n    <g class=\"loop\" id=\"loop-right\">\n      <circle r=\"78\" fill=\"transparent\" stroke=\"none\"><\u002Fcircle>\n      <image id=\"img-right\" href=\"38e06632-94ba-45c8-aa31-36cc73e9c01a\" x=\"-80\" y=\"-80\" width=\"160\" height=\"160\" preserveAspectRatio=\"xMidYMid meet\"><\u002Fimage>\n    <\u002Fg>\n\n  <\u002Fsvg>\n\n<\u002Fdiv>\n\n<script>\n/* ============================================================\n   SPRING PHYSICS\n   Under-damped harmonic oscillator.\n   position / velocity in degrees; time in seconds.\n\n   With k=100, c=6.5, m=1:\n     ω₀  = √100 = 10 rad/s\n     ζ   = 6.5 / (2×10) = 0.325   →  underdamped, ~2 visible bounces\n     T   ≈ 0.64 s per oscillation\n     settle ≈ 1.2 s\n   ============================================================ */\nfunction mkSpring(k, c) {\n  return { k, c, pos: 0, vel: 0, target: 0 };\n}\n\nfunction stepSpring(sp, dt) {\n  const a = -sp.k * (sp.pos - sp.target) - sp.c * sp.vel;\n  sp.vel += a * dt;\n  sp.pos += sp.vel * dt;\n}\n\nfunction atRest(sp, tol) {\n  return Math.abs(sp.pos - sp.target) < tol && Math.abs(sp.vel) < tol;\n}\n\n/* ============================================================\n   LOOP DESCRIPTORS\n   cx / cy   — canvas-space centre of each loop (in viewBox units)\n   initAngle — rotation so the PNG apex points in the right direction\n               PNG default: apex at top (12 o'clock)\n               +degrees = clockwise rotation in SVG\n   flipAngle — how far to rotate on hover (+CW, −CCW)\n   ============================================================ */\nconst LOOPS = [\n  {\n    // Left loop: centre lower-left, apex pointing SW (7 o'clock)\n    cx: -33,  cy: -6,\n    initAngle:    0,\n    flipAngle: +180,   // flips clockwise\n    g:  document.getElementById('loop-left'),\n    sp: mkSpring(100, 6.5)\n  },\n  {\n    // Right loop: centre upper-right, apex pointing NE (1 o'clock)\n    cx:  28,  cy: 26,\n    initAngle:  180,\n    flipAngle: -180,   // flips counter-clockwise\n    g:  document.getElementById('loop-right'),\n    sp: mkSpring(100, 6.5)\n  }\n];\n\n/* ============================================================\n   TRANSFORMS\n   Each group: translate to its centre, then rotate.\n   The image is already centred at the group origin (x=−80, y=−80).\n   ============================================================ */\nfunction applyTransforms() {\n  LOOPS.forEach(loop => {\n    const angle = loop.initAngle + loop.sp.pos;\n    loop.g.setAttribute(\n      'transform',\n      `translate(${loop.cx} ${loop.cy}) rotate(${angle.toFixed(3)})`\n    );\n  });\n}\napplyTransforms();   // render initial state immediately\n\n/* ============================================================\n   ANIMATION LOOP\n   ============================================================ */\nconst TOL   = 0.06;   // rest threshold (degrees / deg·s⁻¹)\nlet   raf   = null;\nlet   lastT = null;\n\nfunction tick(now) {\n  const dt = lastT !== null\n    ? Math.min((now - lastT) / 1000, 0.05)\n    : 0.016;\n  lastT = now;\n\n  LOOPS.forEach(loop => stepSpring(loop.sp, dt));\n  applyTransforms();\n\n  if (LOOPS.every(loop => atRest(loop.sp, TOL))) {\n    // Snap cleanly to target and stop\n    LOOPS.forEach(loop => { loop.sp.pos = loop.sp.target; loop.sp.vel = 0; });\n    applyTransforms();\n    raf = null; lastT = null;\n  } else {\n    raf = requestAnimationFrame(tick);\n  }\n}\n\nfunction startAnim() {\n  if (!raf) { lastT = null; raf = requestAnimationFrame(tick); }\n}\n\n/* ============================================================\n   IDLE ANIMATION\n   After 1.5 s of no interaction: stagger-flip both loops,\n   pause 1 s, stagger-flip back, pause 1 s, repeat.\n   Any hover cancels the sequence immediately.\n   ============================================================ */\nconst STAGGER    = 200;   // ms between first and second loop flip\nconst POST_FLIP  = 1300;  // ms after last flip before next phase\n\nconst sleep = ms => new Promise(r => setTimeout(r, ms));\n\nlet idleSeqId  = 0;\nlet idleTimer  = null;\n\nfunction cancelIdle() {\n  idleSeqId++;\n  clearTimeout(idleTimer);\n  idleTimer = null;\n}\n\nfunction scheduleIdle() {\n  if (LOOPS.some(l => l.hovered)) return;\n  clearTimeout(idleTimer);\n  idleTimer = setTimeout(() => {\n    const myId = ++idleSeqId;\n    runIdleLoop(myId);\n  }, 1000);\n}\n\nasync function runIdleLoop(seqId) {\n  const ok = () => seqId === idleSeqId && LOOPS.every(l => !l.hovered);\n\n  while (true) {\n    // — Phase A: stagger flip OUT —\n    if (!ok()) break;\n    LOOPS[0].sp.target = LOOPS[0].flipAngle; startAnim();\n\n    await sleep(STAGGER);\n    if (!ok()) break;\n    LOOPS[1].sp.target = LOOPS[1].flipAngle; startAnim();\n\n    await sleep(POST_FLIP);\n\n    // — Phase B: stagger flip BACK —\n    if (!ok()) break;\n    LOOPS[0].sp.target = 0; startAnim();\n\n    await sleep(STAGGER);\n    if (!ok()) break;\n    LOOPS[1].sp.target = 0; startAnim();\n\n    await sleep(POST_FLIP);\n  }\n}\n\n/* ============================================================\n   INTERACTION — mouse hover + touch toggle\n   ============================================================ */\nLOOPS.forEach(loop => {\n  loop.hovered = false;\n\n  loop.g.addEventListener('mouseenter', () => {\n    loop.hovered = true;\n    cancelIdle();\n    loop.sp.target = loop.flipAngle;\n    startAnim();\n  });\n\n  loop.g.addEventListener('mouseleave', () => {\n    loop.hovered = false;\n    // Return ALL unhovered loops to home so idle state stays clean\n    LOOPS.forEach(l => { if (!l.hovered) l.sp.target = 0; });\n    startAnim();\n    scheduleIdle();\n  });\n\n  // Touch: tap to toggle\n  loop.g.addEventListener('touchstart', e => {\n    e.preventDefault();\n    loop.hovered = true;\n    cancelIdle();\n    loop.sp.target = Math.abs(loop.sp.target) > 90 ? 0 : loop.flipAngle;\n    startAnim();\n  }, { passive: false });\n\n  loop.g.addEventListener('touchend', () => {\n    loop.hovered = false;\n    scheduleIdle();\n  });\n});\n\n// Kick off idle animation on first load\nscheduleIdle();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
