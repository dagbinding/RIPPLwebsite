<style>
  @font-face { font-family: "Inter"; font-weight: 300; font-style: normal; font-display: swap; src: url("styles/fonts/Inter-Light.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 400; font-style: normal; font-display: swap; src: url("styles/fonts/Inter-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; font-style: normal; font-display: swap; src: url("styles/fonts/Inter-SemiBold.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700; font-style: normal; font-display: swap; src: url("styles/fonts/Inter-Bold.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 900; font-style: normal; font-display: swap; src: url("styles/fonts/Inter-Black.woff2") format("woff2"); }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  :root {
    --rippl-cream: #F2EBDC;
    --rippl-bone: #FAF6EC;
    --rippl-cocoa: #2E1E10;
    --rippl-ink: #0E0E0E;
    --rippl-sun: #D97740;
    --rippl-wave: #4A7C8A;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --dur-fast: 120ms;
    --gutter: clamp(16px, 6vw, 96px);
  }

  body {
    font-family: var(--font-body);
    color: var(--rippl-cream);
    background: var(--rippl-ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  a { color: inherit; text-decoration: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ============ Top bar ============ */
  .nav {
    position: absolute; z-index: 10; top: 0; left: 0; right: 0;
    display: flex; align-items: center;
    padding: 22px var(--gutter);
  }
  .nav__brand { display: flex; align-items: center; min-height: 44px; }
  .nav__brand img { display: block; height: 20px; width: auto; }
  .nav__brand:focus-visible { outline: 2px solid var(--rippl-wave); outline-offset: 2px; }

  /* ============ Stage: one screen, photo + signup ============ */
  .stage {
    position: relative; overflow: hidden;
    display: flex; align-items: flex-end;
    min-height: 100vh; min-height: 100svh;
    padding: 120px var(--gutter) clamp(48px, 10vh, 112px);
  }
  .stage__bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 63% 45%; }
  /* Scrim so type on the photo clears 4.5:1 */
  .stage__scrim {
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(14,14,14,0.5) 0%, rgba(14,14,14,0) 55%),
      linear-gradient(180deg, rgba(14,14,14,0.25) 0%, rgba(14,14,14,0) 30%, rgba(14,14,14,0.8) 76%, rgba(14,14,14,0.92) 100%);
  }

  .panel { position: relative; z-index: 1; width: 100%; max-width: 820px; display: grid; gap: clamp(20px, 3vh, 28px); }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 12px; margin: 0;
    font-size: 13px; font-weight: 600; letter-spacing: 0.2em; text-transform: lowercase;
    color: rgba(242, 235, 220, 0.78);
  }
  .eyebrow::before { content: ""; width: 28px; height: 1px; background: var(--rippl-sun); }
  .title {
    margin: 0; font-weight: 900; text-transform: uppercase;
    line-height: 0.88; letter-spacing: -0.045em; text-wrap: balance;
    font-size: clamp(52px, min(8.4vw, 14vh), 132px);
  }
  .dot { color: var(--rippl-sun); }
  .lede {
    margin: 0; max-width: 44ch; text-wrap: pretty;
    font-size: clamp(17px, 1.3vw, 20px); line-height: 1.5;
    color: rgba(242, 235, 220, 0.86);
  }
  .lede b { font-weight: 600; color: #fff; }

  /* One field + button, in a single pill. Posts to LaunchList. */
  .join {
    display: flex; gap: 6px; padding: 6px; max-width: 560px;
    background: var(--rippl-bone); border-radius: 999px;
    box-shadow: 0 22px 60px rgba(46, 30, 16, 0.22);
  }
  .join input {
    flex: 1; min-width: 0; min-height: 52px; padding: 0 20px;
    border: 0; border-radius: 999px; background: transparent;
    font: 400 16px/1.2 var(--font-body); color: var(--rippl-cocoa);
  }
  .join input::placeholder { color: rgba(46, 30, 16, 0.42); }
  .join input:focus-visible { outline: 2px solid var(--rippl-wave); outline-offset: 0; }
  .btn {
    flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; gap: 12px;
    min-height: 52px; padding: 0 28px; border: 0; border-radius: 999px; cursor: pointer;
    font: 700 16px/1 var(--font-body); letter-spacing: 0.01em;
    background: var(--rippl-sun); color: var(--rippl-cocoa);
    transition: background-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
  }
  .btn:hover { background: #D5733C; box-shadow: 0 8px 24px rgba(217, 119, 64, 0.32); }
  .btn:active { background: #CC6C37; box-shadow: none; }
  .btn:focus-visible { outline: 2px solid var(--rippl-wave); outline-offset: 2px; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn__arrow { transition: transform 220ms var(--ease-out); }
  .btn:hover .btn__arrow { transform: translateX(3px); }

  /* ============ Footer ============ */
  .footer {
    display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 32px var(--gutter);
    font-size: 13px; letter-spacing: 0.04em; color: rgba(255,255,255,0.55);
  }
  .footer__brand img { height: 18px; width: auto; display: block; }

  /* ============ Entrances: fade + 16px rise ============ */
  [data-in] { opacity: 0; transform: translateY(16px); transition: opacity 700ms var(--ease-out), transform 700ms var(--ease-out); transition-delay: var(--d, 0ms); }
  .is-ready [data-in] { opacity: 1; transform: none; }

  /* ============ Tablet & phone ============ */
  /* Photo fills the top half so the surfer sits above the type, not behind it */
  @media (max-width: 900px) {
    .stage { padding-top: 96px; }
    .stage__bg { height: 56vh; height: 56svh; object-position: 60% 50%; }
    .stage__scrim { background: linear-gradient(180deg, rgba(14,14,14,0.3) 0%, rgba(14,14,14,0) 18%, rgba(14,14,14,0) 34%, var(--rippl-ink) 56%); }
  }
  @media (max-width: 560px) {
    .title { font-size: clamp(44px, 14vw, 72px); }
    .join { flex-direction: column; border-radius: 16px; padding: 8px; }
    .join input { border-radius: 10px; }
    .btn { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    [data-in] { opacity: 1 !important; transform: none !important; transition: none !important; }
    * { transition-duration: 0ms !important; animation: none !important; }
  }
</style>

  // Only track the live site — local previews and Netlify deploy previews
  // stay out of the analytics. PostHog (and the replay/survey scripts it
  // pulls in) starts once the page has loaded and the browser is idle, so

  if (/(^|\.)ripplsurf\.com$/.test(location.hostname)) {

      posthog.init('phc_onPTvoga4RPG4wu6cH9zQeLxMGikXapR8HZj7EtZV6a4', {

<body data-screen-label="Waitlist">
  <!-- ░░ Full-screen brand loader — self-injects, fades out on page ready ░░ -->
  <script src="assets/loader.js"></script>
  <nav class="nav" aria-label="Primary">
    <a href="/" class="nav__brand" aria-label="RIPPL home">
      <img src="assets/img/logo-wordmark-white-1280.png" width="1280" height="276" alt="RIPPL" />
    </a>
  </nav>

  <main class="stage" data-screen-label="01 Signup">
    <img class="stage__bg" src="assets/img/waitlist-bigturn-2400.webp" srcset="assets/img/waitlist-bigturn-1200.webp 1200w, assets/img/waitlist-bigturn-2400.webp 2400w" sizes="100vw" width="2400" height="1600" alt="" decoding="async" fetchpriority="high" />
    <div class="stage__scrim" aria-hidden="true"></div>

    <div class="panel">
      <p class="eyebrow" data-in style="--d: 60ms">waitlist · open now</p>
      <h1 class="title" data-in style="--d: 140ms">Be first<br />in the water<span class="dot">.</span></h1>
      <p class="lede" data-in style="--d: 240ms">The first surfers in get <b>early access</b> to RIPPLsense and the app, and a direct line to the team building it.</p>
      <form class="join launchlist-form" action="https://getlaunchlist.com/s/uYSrba" method="POST" data-in style="--d: 320ms">
        <label for="email" class="sr">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="Your email" required />
        <button class="btn" type="submit">Join the waitlist <span class="btn__arrow" aria-hidden="true">→</span></button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <a href="/" class="footer__brand" aria-label="RIPPL home">
      <img src="assets/img/logo-wordmark-white-1280.png" width="1280" height="276" alt="RIPPL" loading="lazy" />
    </a>
    <span>© 2026 RIPPL · intelligent motion tech for surfing</span>
  </footer>

  <script>
    (function () {
      // Entrances: two frames so the transition runs; the timeout covers background tabs.
      var ready = function () { document.documentElement.classList.add('is-ready'); };
      requestAnimationFrame(function () { requestAnimationFrame(ready); });
      setTimeout(ready, 150);

      // The form posts straight to LaunchList, which shows its thank-you
      // page with the surfer's referral link. Log the signup first; beacon
      // transport lets the event survive the page change.
      var form = document.querySelector('.launchlist-form');
      var btn = form.querySelector('button');
      var label = btn.innerHTML;
      form.addEventListener('submit', function () {
        if (window.posthog && posthog.capture) {
          posthog.capture('waitlist_form_submitted', { form: 'launchlist', page: location.pathname }, { transport: 'sendBeacon' });
        }
        btn.disabled = true;
        btn.textContent = 'Joining…';
      });
      // Coming back with the browser's Back button restores the page as it was left.
      window.addEventListener('pageshow', function () {
        btn.disabled = false;
        btn.innerHTML = label;
      });
    })();
  </script>
</body>
